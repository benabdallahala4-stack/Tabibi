<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" fill="none" role="img" aria-label="Équipe soignante Seha">
  <defs>
    <linearGradient id="coatF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7eefc"/>
    </linearGradient>
    <linearGradient id="coatM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#dbe8fe"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8ef8"/><stop offset="1" stop-color="#1c4fdb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eff5ff"/>
    </linearGradient>
  </defs>

  <!-- Backdrop discs -->
  <circle cx="600" cy="450" r="370" fill="#ffffff" opacity="0.08"/>
  <circle cx="600" cy="450" r="370" fill="url(#disc)" opacity="0.32"/>
  <circle cx="600" cy="450" r="280" fill="#ffffff" opacity="0.10"/>

  <!-- ECG pulse arc -->
  <path d="M110 235 H350 l38 -66 58 145 44 -104 28 29 H1000"
        stroke="#ffffff" stroke-opacity="0.5" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Male doctor (back-right) ===== -->
  <g>
    <path d="M700 900 V735 c0 -112 74 -176 166 -176 s166 64 166 176 V900 Z" fill="url(#coatM)"/>
    <rect x="828" y="512" width="60" height="80" rx="26" fill="#e9b489"/>
    <circle cx="858" cy="452" r="74" fill="#efbf94"/>
    <path d="M784 448 c0 -60 38 -104 74 -104 s74 44 74 104 c0 -16 -16 -40 -36 -45 c-26 22 -80 22 -114 5 c-8 10 0 26 2 40 Z" fill="#2b3a67"/>
    <circle cx="838" cy="446" r="5.5" fill="#2b3a67"/><circle cx="878" cy="446" r="5.5" fill="#2b3a67"/>
    <path d="M840 474 q18 16 36 0" stroke="#c98d63" stroke-width="4.5" stroke-linecap="round"/>
    <!-- red cross badge -->
    <rect x="930" y="650" width="60" height="60" rx="14" fill="#ffffff"/>
    <g fill="#e70013"><rect x="953" y="660" width="14" height="40" rx="5"/><rect x="940" y="673" width="40" height="14" rx="5"/></g>
  </g>

  <!-- ===== Female doctor (front-left) ===== -->
  <g>
    <path d="M300 900 V720 c0 -122 82 -192 184 -192 s184 70 184 192 V900 Z" fill="url(#coatF)"/>
    <!-- lapels -->
    <path d="M484 536 l-72 74 40 40 32 -52 32 52 40 -40 Z" fill="#dbe8fe"/>
    <path d="M484 536 v320" stroke="#cddcfb" stroke-width="4"/>
    <rect x="448" y="468" width="72" height="92" rx="30" fill="#f2c9a0"/>
    <!-- hair behind -->
    <path d="M392 430 c0 -78 40 -134 92 -134 s92 56 92 134 v120 l-26 -10 v-96 c-40 22 -92 22 -132 0 v96 l-26 10 Z" fill="#3a2b52"/>
    <circle cx="484" cy="404" r="86" fill="#f7d3ab"/>
    <path d="M398 402 c0 -70 40 -118 86 -118 s86 48 86 118 c-14 -34 -44 -52 -86 -52 s-72 18 -86 52 Z" fill="#3a2b52"/>
    <circle cx="460" cy="404" r="6" fill="#2b3a67"/><circle cx="508" cy="404" r="6" fill="#2b3a67"/>
    <path d="M462 432 q22 20 44 0" stroke="#c98d63" stroke-width="5" stroke-linecap="round"/>
    <!-- stethoscope -->
    <path d="M440 560 c-42 40 -42 132 4 164" stroke="#1c4fdb" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M528 560 c32 34 28 98 -8 130" stroke="#1c4fdb" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="442" cy="728" r="26" fill="url(#disc)"/><circle cx="442" cy="728" r="12" fill="#eff5ff"/>
  </g>

  <!-- Floating card: appointment confirmed -->
  <g transform="rotate(-6 240 340)">
    <rect x="110" y="310" width="250" height="96" rx="20" fill="url(#card)"/>
    <circle cx="158" cy="358" r="26" fill="#1c4fdb"/>
    <path d="M146 358 l9 9 17 -19" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="338" width="128" height="14" rx="7" fill="#1a3173"/>
    <rect x="198" y="364" width="92" height="12" rx="6" fill="#93b8fd"/>
  </g>

  <!-- Floating card: rating -->
  <g transform="rotate(7 920 360)">
    <rect x="820" y="320" width="210" height="84" rx="20" fill="url(#card)"/>
    <g fill="#f5b301" transform="translate(844 350)">
      <path d="M12 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M42 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M72 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M102 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M132 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
    </g>
    <rect x="844" y="372" width="150" height="12" rx="6" fill="#93b8fd"/>
  </g>

  <!-- jasmine petal accents -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="300" cy="560" r="7"/><circle cx="700" cy="250" r="6"/>
    <circle cx="980" cy="470" r="8"/><circle cx="180" cy="200" r="8"/>
  </g>
</svg>
