<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" fill="none" role="img" aria-label="Professionnel de santé Seha">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7eefc"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8ef8"/>
      <stop offset="1" stop-color="#1c4fdb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff5ff"/>
    </linearGradient>
  </defs>

  <!-- Soft backdrop disc -->
  <circle cx="600" cy="440" r="360" fill="#ffffff" opacity="0.08"/>
  <circle cx="600" cy="440" r="360" fill="url(#disc)" opacity="0.35"/>
  <circle cx="600" cy="440" r="270" fill="#ffffff" opacity="0.10"/>

  <!-- ECG pulse arc -->
  <path d="M120 250 H360 l40 -70 60 150 46 -110 30 30 H980"
        stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Doctor figure -->
  <g>
    <!-- shoulders / coat -->
    <path d="M420 900 V720 c0 -120 80 -190 180 -190 s180 70 180 190 V900 Z" fill="url(#coat)"/>
    <!-- coat lapels -->
    <path d="M600 540 l-70 70 40 40 30 -50 30 50 40 -40 Z" fill="#dbe8fe"/>
    <path d="M600 540 v300" stroke="#cddcfb" stroke-width="4"/>
    <!-- neck -->
    <rect x="565" y="470" width="70" height="90" rx="30" fill="#f2c9a0"/>
    <!-- head -->
    <circle cx="600" cy="405" r="86" fill="#f7d3ab"/>
    <!-- hair -->
    <path d="M514 400 c0 -70 45 -120 86 -120 s86 50 86 120 c0 -18 -18 -46 -40 -52 c-30 26 -92 26 -132 6 c-10 12 -0 30 0 46 Z" fill="#2b3a67"/>
    <!-- smile -->
    <path d="M576 430 q24 22 48 0" stroke="#c98d63" stroke-width="5" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="576" cy="398" r="6" fill="#2b3a67"/>
    <circle cx="624" cy="398" r="6" fill="#2b3a67"/>

    <!-- stethoscope -->
    <path d="M556 560 c-40 40 -40 130 4 160" stroke="#1c4fdb" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M644 560 c30 34 26 96 -8 128" stroke="#1c4fdb" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="558" cy="726" r="26" fill="url(#disc)"/>
    <circle cx="558" cy="726" r="12" fill="#eff5ff"/>
    <!-- red cross badge on coat -->
    <rect x="690" y="640" width="70" height="70" rx="16" fill="#ffffff"/>
    <g fill="#e70013">
      <rect x="717" y="652" width="16" height="46" rx="6"/>
      <rect x="702" y="667" width="46" height="16" rx="6"/>
    </g>
  </g>

  <!-- Floating card: appointment confirmed -->
  <g transform="rotate(-6 250 360)">
    <rect x="120" y="330" width="250" height="96" rx="20" fill="url(#card)"/>
    <circle cx="168" cy="378" r="26" fill="#1c4fdb"/>
    <path d="M156 378 l9 9 17 -19" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="208" y="358" width="128" height="14" rx="7" fill="#1a3173"/>
    <rect x="208" y="384" width="92" height="12" rx="6" fill="#93b8fd"/>
  </g>

  <!-- Floating card: rating -->
  <g transform="rotate(7 900 420)">
    <rect x="800" y="380" width="210" height="84" rx="20" fill="url(#card)"/>
    <g fill="#f5b301" transform="translate(824 410)">
      <path d="M12 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M42 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M72 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M102 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
      <path d="M132 0 l4 8 9 1 -6 7 1 9 -8 -4 -8 4 1 -9 -6 -7 9 -1 Z"/>
    </g>
    <rect x="824" y="432" width="150" height="12" rx="6" fill="#93b8fd"/>
  </g>

  <!-- jasmine petals accents -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="300" cy="600" r="7"/>
    <circle cx="860" cy="640" r="9"/>
    <circle cx="940" cy="250" r="6"/>
    <circle cx="200" cy="200" r="8"/>
  </g>
</svg>
